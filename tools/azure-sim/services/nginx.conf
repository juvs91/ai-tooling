# nginx delante de registry:2 = "ACR" del simulador.
# PUT/DELETE de manifests pasan por azure_mock (que aplica los locks de tag y de
# digest como ACR); todo lo demás (blobs, lecturas) va directo al registry.
events {}

http {
  upstream registry   { server registry:5000; }
  upstream azure_mock { server azure-mock:8082; }

  map $request_method $manifest_upstream {
    PUT     azure_mock;
    DELETE  azure_mock;
    default registry;
  }

  server {
    listen 80;
    client_max_body_size 0;
    chunked_transfer_encoding on;

    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto http;

    location ~ ^/v2/.+/manifests/ {
      proxy_pass http://$manifest_upstream;
    }

    location / {
      proxy_pass http://registry;
    }
  }
}
