# Config mínima para el POC — mem_limit del contenedor es ~512MB, así que shared_buffers y
# work_mem se mantienen bajos a propósito (nada que ver con el tuning real de producción).
listen_addresses = '*'
shared_preload_libraries = 'citus,age'
max_connections = 20
shared_buffers = 128MB
work_mem = 16MB
maintenance_work_mem = 64MB
